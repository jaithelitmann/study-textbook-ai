<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Year 7 Science — Yearly Test Revision</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=Newsreader:opsz,wght@6..72,500;6..72,700&display=swap" rel="stylesheet" />
<style>
:root {
  --bg: #f4f2ec;
  --surface: #ffffff;
  --ink: #1c2529;
  --ink-2: #4a565c;
  --ink-3: #7d878c;
  --line: #dedad0;
  --green: #2c6e49;
  --green-soft: #e3efe7;
  --amber: #e8b53a;
  --amber-soft: #fbf1d6;
  --red: #b8462f;
  --red-soft: #f7e3dd;
  --blue: #2f5d86;
  --blue-soft: #e2ebf3;
  --radius: 10px;
  --serif: "Newsreader", Georgia, "Times New Roman", serif;
  --sans: "Atkinson Hyperlegible", system-ui, -apple-system, "Segoe UI", sans-serif;
}
* { box-sizing: border-box; }
html, body { margin: 0; background: var(--bg); color: var(--ink); font-family: var(--sans); font-size: 16px; line-height: 1.55; }
button, input, textarea, select { font: inherit; color: inherit; }
h1, h2, h3, h4 { font-family: var(--serif); font-weight: 700; line-height: 1.2; margin: 0 0 .5em; letter-spacing: -.01em; }
h1 { font-size: 2.1rem; } h2 { font-size: 1.5rem; } h3 { font-size: 1.15rem; margin-top: 1.2em; }
p { margin: 0 0 .8em; }
mark { background: var(--amber-soft); box-shadow: inset 0 -.45em 0 var(--amber); padding: 0 2px; color: inherit; }
a { color: var(--blue); }

.shell { display: grid; grid-template-columns: 240px 1fr; min-height: 100vh; }
.side { position: sticky; top: 0; height: 100vh; overflow-y: auto; background: var(--ink); color: #e9ecea; padding: 20px 14px; display: flex; flex-direction: column; gap: 18px; }
.brand { display: flex; gap: 10px; align-items: center; padding: 0 6px; }
.brand-mark { width: 38px; height: 38px; border-radius: 8px; background: var(--amber); color: var(--ink); display: grid; place-items: center; font: 700 1.4rem var(--serif); }
.brand b { display: block; font-family: var(--serif); font-size: 1.05rem; }
.brand small { color: #a9b3b0; font-size: .8rem; }
#nav { display: flex; flex-direction: column; gap: 2px; }
#nav button { all: unset; cursor: pointer; padding: 9px 12px; border-radius: 8px; display: flex; gap: 10px; align-items: center; color: #cdd5d2; font-size: .95rem; }
#nav button:hover { background: #2b383d; color: #fff; }
#nav button[aria-current="true"] { background: #f4f2ec; color: var(--ink); font-weight: 700; }
#nav .ico { width: 20px; text-align: center; opacity: .85; }
.side-foot { margin-top: auto; font-size: .85rem; color: #a9b3b0; padding: 0 6px; }
.side-foot b { color: var(--amber); font-size: 1.6rem; font-family: var(--serif); display: block; }

main { padding: 32px clamp(16px, 4vw, 48px) 80px; max-width: 1100px; width: 100%; outline: none; }
.eyebrow { text-transform: uppercase; letter-spacing: .08em; font-size: .75rem; color: var(--ink-3); font-weight: 700; margin-bottom: 4px; }
.lede { color: var(--ink-2); max-width: 62ch; }

.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 20px; }
.grid { display: grid; gap: 16px; }
.g2 { grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); }
.g3 { grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); }
.row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.spread { justify-content: space-between; }
.muted { color: var(--ink-3); font-size: .9rem; }
.stack > * + * { margin-top: 16px; }

.btn { border: 1px solid var(--ink); background: var(--ink); color: #fff; border-radius: 8px; padding: 9px 16px; cursor: pointer; font-weight: 700; font-size: .95rem; }
.btn:hover { background: #33424a; }
.btn.ghost { background: transparent; color: var(--ink); border-color: var(--line); }
.btn.ghost:hover { border-color: var(--ink); }
.btn.green { background: var(--green); border-color: var(--green); }
.btn.sm { padding: 5px 11px; font-size: .85rem; }
.btn:disabled { opacity: .5; cursor: not-allowed; }
.chip { border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 5px 12px; cursor: pointer; font-size: .85rem; }
.chip[aria-pressed="true"] { background: var(--ink); color: #fff; border-color: var(--ink); }
.tag { display: inline-block; font-size: .72rem; font-weight: 700; text-transform: uppercase; letter-spacing: .05em; padding: 2px 8px; border-radius: 4px; background: var(--blue-soft); color: var(--blue); }
.tag.C { background: var(--green-soft); color: var(--green); } .tag.O { background: #e8f0e0; color: #4f6b2a; }
.tag.K { background: #efe6f0; color: #6d4a72; } .tag.P { background: var(--blue-soft); color: var(--blue); }
.tag.H { background: var(--red-soft); color: var(--red); } .tag.W { background: var(--amber-soft); color: #8a6512; }

/* dashboard */
.hero { display: grid; grid-template-columns: 1.4fr 1fr; gap: 16px; margin-bottom: 16px; }
.hero .big { background: var(--green); color: #fff; border: 0; }
.hero .big h1 { color: #fff; }
.hero .big p { color: #d6e7dc; }
.stat { font: 700 2.4rem var(--serif); line-height: 1; }
.bar { height: 8px; background: #ece8de; border-radius: 99px; overflow: hidden; }
.bar > i { display: block; height: 100%; background: var(--green); border-radius: 99px; }
.bar.low > i { background: var(--red); } .bar.mid > i { background: var(--amber); }
.topic-row { display: grid; grid-template-columns: 1fr 120px 48px; gap: 12px; align-items: center; padding: 8px 0; border-bottom: 1px dashed var(--line); font-size: .92rem; }
.topic-row:last-child { border-bottom: 0; }
.quick { text-align: left; cursor: pointer; transition: border-color .15s, transform .15s; }
.quick:hover { border-color: var(--ink); transform: translateY(-2px); }
.quick b { font-family: var(--serif); font-size: 1.1rem; display: block; }

/* notes */
.note { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); margin-bottom: 14px; overflow: hidden; }
.note > summary { cursor: pointer; padding: 16px 20px; list-style: none; display: flex; justify-content: space-between; gap: 12px; align-items: center; }
.note > summary::-webkit-details-marker { display: none; }
.note > summary h2 { margin: 0; font-size: 1.25rem; }
.note > summary::after { content: "+"; font: 700 1.4rem var(--serif); color: var(--ink-3); }
.note[open] > summary::after { content: "–"; }
.note .body { padding: 0 20px 20px; border-top: 1px solid var(--line); }
.syl { font-size: .8rem; color: var(--ink-3); margin: 12px 0 0; padding-left: 10px; border-left: 3px solid var(--amber); }
table { border-collapse: collapse; width: 100%; font-size: .92rem; margin: 8px 0 12px; }
th, td { text-align: left; padding: 8px 10px; border-bottom: 1px solid var(--line); vertical-align: top; }
th { background: #f7f5f0; font-weight: 700; }
.eq { font-family: var(--serif); font-size: 1.15rem; background: #f7f5f0; padding: 10px 14px; border-radius: 8px; }
.eq span { color: var(--green); font-size: .9rem; }
.tip { background: var(--amber-soft); border-left: 4px solid var(--amber); padding: 10px 14px; border-radius: 0 8px 8px 0; font-size: .93rem; }
.search { width: 100%; max-width: 380px; padding: 9px 14px; border: 1px solid var(--line); border-radius: 8px; background: var(--surface); }

/* quiz */
.q { font-size: 1.12rem; font-weight: 700; margin: 10px 0 14px; }
.opts { display: grid; gap: 8px; }
.opt { text-align: left; border: 1.5px solid var(--line); background: var(--surface); border-radius: 8px; padding: 11px 14px; cursor: pointer; display: flex; gap: 12px; }
.opt:hover:not(:disabled) { border-color: var(--ink); }
.opt .l { font-weight: 700; color: var(--ink-3); }
.opt.right { border-color: var(--green); background: var(--green-soft); }
.opt.wrong { border-color: var(--red); background: var(--red-soft); }
.opt:disabled { cursor: default; }
.explain { margin-top: 12px; padding: 10px 14px; border-radius: 8px; background: #f7f5f0; font-size: .93rem; }
.progress-line { height: 4px; background: var(--line); border-radius: 9px; margin: 6px 0 18px; }
.progress-line i { display: block; height: 100%; background: var(--ink); border-radius: 9px; transition: width .3s; }

textarea { width: 100%; min-height: 120px; padding: 12px; border: 1px solid var(--line); border-radius: 8px; background: #fdfcf9; resize: vertical; line-height: 1.5; }
textarea:focus, .search:focus { outline: 2px solid var(--blue); outline-offset: 1px; }
.feedback { white-space: pre-wrap; background: #f7f5f0; border-radius: 8px; padding: 14px 16px; font-size: .94rem; margin-top: 12px; }
.feedback .score { font: 700 1.6rem var(--serif); color: var(--green); }
.model { border-left: 3px solid var(--green); padding: 8px 14px; background: var(--green-soft); border-radius: 0 8px 8px 0; font-size: .93rem; margin-top: 10px; }
.sa-list { display: grid; gap: 6px; }
.sa-item { text-align: left; border: 1px solid var(--line); background: var(--surface); border-radius: 8px; padding: 10px 14px; cursor: pointer; display: flex; justify-content: space-between; gap: 10px; align-items: center; }
.sa-item:hover { border-color: var(--ink); }
.sa-item .done { color: var(--green); font-weight: 700; font-size: .85rem; white-space: nowrap; }
.plan { counter-reset: p; list-style: none; padding: 0; margin: 8px 0; }
.plan li { counter-increment: p; padding: 4px 0 4px 30px; position: relative; font-size: .93rem; }
.plan li::before { content: counter(p); position: absolute; left: 0; top: 4px; width: 20px; height: 20px; border-radius: 50%; background: var(--ink); color: #fff; font-size: .72rem; display: grid; place-items: center; font-weight: 700; }

/* flashcards */
.flash { perspective: 1200px; height: 280px; max-width: 560px; margin: 0 auto; cursor: pointer; }
.flash-in { position: relative; width: 100%; height: 100%; transition: transform .5s; transform-style: preserve-3d; }
.flash.flipped .flash-in { transform: rotateY(180deg); }
.face { position: absolute; inset: 0; backface-visibility: hidden; border-radius: 14px; border: 1px solid var(--line); background: var(--surface); display: grid; place-items: center; padding: 28px; text-align: center; }
.face.front h2 { font-size: 1.8rem; margin: 0; }
.face.back { transform: rotateY(180deg); background: var(--ink); color: #fff; font-size: 1.15rem; }
.face small { position: absolute; bottom: 14px; left: 0; right: 0; color: var(--ink-3); font-size: .8rem; }
.face.back small { color: #a9b3b0; }

/* diagrams */
.diagram-wrap { display: grid; grid-template-columns: 1.3fr 1fr; gap: 16px; align-items: start; }
.diagram svg { width: 100%; height: auto; display: block; }
.org { cursor: pointer; transition: opacity .2s; }
.org:hover { opacity: .8; }
.org.dim { opacity: .25; }
.org.hit { animation: pulse 0.6s ease 2; }
@keyframes pulse { 50% { transform: scale(1.04); filter: brightness(1.2); } }
.info { min-height: 220px; }
.info h3 { margin-top: 0; font-size: 1.4rem; }
.callout { font-size: .85rem; color: var(--ink-3); }
canvas { width: 100%; display: block; border-radius: 8px; background: #fbfaf6; border: 1px solid var(--line); }
input[type=range] { width: 100%; accent-color: var(--green); }
.state-pill { font: 700 1.1rem var(--serif); padding: 4px 12px; border-radius: 6px; display: inline-block; }
.state-solid { background: var(--blue-soft); color: var(--blue); }
.state-liquid { background: var(--green-soft); color: var(--green); }
.state-gas { background: var(--red-soft); color: var(--red); }
.state-change { background: var(--amber-soft); color: #8a6512; }
.ladder { display: flex; gap: 6px; flex-wrap: wrap; }
.ladder button { flex: 1 1 120px; border: 1.5px solid var(--line); background: var(--surface); border-radius: 8px; padding: 12px 8px; cursor: pointer; font-weight: 700; text-align: center; }
.ladder button[aria-pressed="true"] { border-color: var(--green); background: var(--green-soft); }
.ladder .size { display: block; font-size: 1.6rem; }

/* tutor */
.chat { display: flex; flex-direction: column; height: calc(100vh - 210px); min-height: 420px; }
.msgs { flex: 1; overflow-y: auto; display: flex; flex-direction: column; gap: 10px; padding: 4px 2px 12px; }
.msg { max-width: 80%; padding: 10px 14px; border-radius: 12px; white-space: pre-wrap; font-size: .95rem; }
.msg.user { align-self: flex-end; background: var(--ink); color: #fff; border-bottom-right-radius: 3px; }
.msg.bot { align-self: flex-start; background: var(--surface); border: 1px solid var(--line); border-bottom-left-radius: 3px; }
.msg.err { background: var(--red-soft); border-color: var(--red); }
.composer { display: flex; gap: 8px; }
.composer textarea { min-height: 48px; height: 48px; }
.suggest { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 10px; }

.grade-tabs { display: flex; gap: 6px; margin-bottom: 12px; }
.grade-tabs button { width: 44px; height: 44px; border-radius: 8px; border: 1.5px solid var(--line); background: var(--surface); font: 700 1.2rem var(--serif); cursor: pointer; }
.grade-tabs button[aria-pressed="true"] { background: var(--ink); color: #fff; border-color: var(--ink); }
ul.clean { padding-left: 18px; margin: 0; } ul.clean li { margin-bottom: 6px; }

@media (max-width: 860px) {
  .shell { grid-template-columns: 1fr; }
  .side { position: sticky; top: 0; z-index: 5; height: auto; padding: 10px; flex-direction: row; align-items: center; gap: 10px; overflow-x: auto; }
  .brand div, .side-foot { display: none; }
  #nav { flex-direction: row; }
  #nav button { white-space: nowrap; padding: 7px 10px; font-size: .85rem; }
  .hero, .diagram-wrap { grid-template-columns: 1fr; }
  main { padding-top: 20px; }
  .chat { height: calc(100vh - 170px); }
  .msg { max-width: 92%; }
}
@media print { .side { display: none; } .shell { display: block; } }

/* timed mock */
.mock-intro { max-width: 760px; }
.mock-facts { display: grid; grid-template-columns: repeat(4, 1fr); gap: 1px; background: var(--line); border: 1px solid var(--line); border-radius: var(--radius); overflow: hidden; margin: 22px 0; }
.mock-facts div { background: var(--surface); padding: 18px 16px; }
.mock-facts b { display: block; font: 700 2.2rem/1 var(--serif); color: var(--green); }
.mock-facts span { color: var(--ink-3); font-size: .85rem; }
.mock { display: grid; grid-template-columns: 220px 1fr; gap: 22px; align-items: start; }
.mock-hud { position: sticky; top: 16px; background: var(--ink); color: #fff; border-radius: var(--radius); padding: 18px; display: flex; flex-direction: column; gap: 14px; }
.mock-hud .muted { color: #ffffff99; margin: 0; }
.mock-clock { font: 700 2.6rem/1 var(--serif); font-variant-numeric: tabular-nums; letter-spacing: .02em; }
.mock-clock.warn { color: var(--amber); animation: pulse 1s ease-in-out infinite alternate; }
@keyframes pulse { to { opacity: .55; } }
.mock-grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px; }
.mock-grid button { aspect-ratio: 1; border: 1px solid #ffffff33; background: transparent; color: #fff; border-radius: 6px; cursor: pointer; font-weight: 700; font-size: .85rem; position: relative; }
.mock-grid button.ok { background: #ffffff22; }
.mock-grid button.cur { background: #fff; color: var(--ink); }
.mock-grid button.fl::after { content: ""; position: absolute; top: 3px; right: 3px; width: 6px; height: 6px; border-radius: 50%; background: var(--amber); }
.mock-body textarea { min-height: 200px; }
.opt.picked { border-color: var(--ink); background: var(--blue-soft); }
.mock-score { display: flex; align-items: baseline; gap: 8px; margin: 4px 0 6px; }
.mock-score b { font: 700 5rem/1 var(--serif); color: var(--green); }
.mock-score span { font: 500 1.8rem var(--serif); color: var(--ink-3); }
.mres { padding: 10px 0; border-top: 1px solid var(--line); }
.mres.no b { color: var(--red); }
.mres summary { cursor: pointer; }
.small { font-size: .85rem; }
@media (max-width: 760px) { .mock { grid-template-columns: 1fr; } .mock-hud { position: static; } .mock-facts { grid-template-columns: repeat(2, 1fr); } }

</style>
</head>
<body>
<div class="shell">
  <aside class="side">
    <div class="brand">
      <span class="brand-mark">7</span>
      <div><b>Science Revision</b><small>Yearly Test · 10 Nov</small></div>
    </div>
    <nav id="nav"></nav>
    <p class="side-foot" id="countdown"></p>
  </aside>
  <main id="main" tabindex="-1"></main>
</div>
<script>window.STUDY_API = "https://science-spark-study-studio.lovable.app";</script>
<script>
/* Year 7 Science — Question bank (Cells & Classification, Particles & States of Matter, Working Scientifically).
   Separation techniques are intentionally NOT included. */
(function () {
  var T = { C: "Cells & Organelles", O: "Cell Organisation", K: "Classification & Living Things", P: "Particle Theory", H: "Heating Curves", W: "Working Scientifically" };
  var mcq = [];
  function M(t, q, o, a, e) { mcq.push({ id: mcq.length + 1, topic: t, q: q, o: o, a: a, e: e }); }

  // ---------- CELLS & ORGANELLES (25) ----------
  M("C", "Which organelle is known as the 'control centre' of the cell?", ["Mitochondria", "Nucleus", "Cytoplasm", "Cell wall"], 1, "The nucleus houses DNA and coordinates all cell activities.");
  M("C", "Where is DNA mainly found in a plant or animal cell?", ["Cytoplasm", "Vacuole", "Nucleus", "Cell membrane"], 2, "DNA (the genetic blueprint) is stored inside the nucleus.");
  M("C", "Which structure controls what enters and leaves a cell?", ["Cell wall", "Cell membrane", "Chloroplast", "Nucleus"], 1, "The cell membrane is selectively permeable — the 'gatekeeper'.");
  M("C", "Cellular respiration occurs in the…", ["Chloroplast", "Nucleus", "Mitochondria", "Vacuole"], 2, "Mitochondria turn glucose into usable energy (ATP).");
  M("C", "Photosynthesis takes place in the…", ["Mitochondria", "Chloroplast", "Cytoplasm", "Cell membrane"], 1, "Chloroplasts contain chlorophyll which captures light energy.");
  M("C", "Which THREE structures are found in plant cells but NOT animal cells?", ["Nucleus, membrane, cytoplasm", "Cell wall, chloroplasts, large central vacuole", "Mitochondria, ribosomes, nucleus", "Cell wall, mitochondria, nucleus"], 1, "Only plant cells have a cell wall, chloroplasts and a large permanent vacuole.");
  M("C", "Which structure is found in BOTH plant and animal cells?", ["Chloroplast", "Cell wall", "Mitochondria", "Large central vacuole"], 2, "Both cell types respire, so both contain mitochondria.");
  M("C", "What is the jelly-like fluid where most chemical reactions happen?", ["Cytoplasm", "Vacuole sap", "Chlorophyll", "DNA"], 0, "Cytoplasm is the 'factory floor' and suspends the organelles.");
  M("C", "What is the main function of the cell wall?", ["Makes glucose", "Provides support and strength", "Controls cell activities", "Releases energy"], 1, "The rigid cell wall supports the plant cell and stops it bursting.");
  M("C", "What is the green pigment inside chloroplasts?", ["Haemoglobin", "Chlorophyll", "Glucose", "Cellulose"], 1, "Chlorophyll absorbs light for photosynthesis.");
  M("C", "Which is the correct word equation for photosynthesis?", ["Glucose + oxygen → carbon dioxide + water", "Carbon dioxide + water → glucose + oxygen", "Oxygen + water → glucose + carbon dioxide", "Glucose + water → oxygen + carbon dioxide"], 1, "CO₂ + water → glucose + oxygen, using light energy.");
  M("C", "What is the energy molecule produced by mitochondria?", ["DNA", "ATP", "CO₂", "Chlorophyll"], 1, "Mitochondria release energy as ATP.");
  M("C", "Animal cells have vacuoles that are…", ["Large and permanent", "Small and temporary", "Filled with chlorophyll", "Absent always"], 1, "Animal cells only have small, temporary vacuoles.");
  M("C", "Why do plant cells need BOTH chloroplasts and mitochondria?", ["Chloroplasts make glucose; mitochondria release its energy", "Both make glucose", "Mitochondria make glucose; chloroplasts store it", "They do the same job"], 0, "The 'Energy Team': chloroplasts manufacture food, mitochondria unlock it as ATP.");
  M("C", "Turgor pressure is caused by…", ["The nucleus expanding", "The vacuole filling with water and pushing on the cell wall", "Mitochondria producing gas", "The membrane shrinking"], 1, "A full vacuole pushes against the rigid wall like a water balloon, keeping the plant upright.");
  M("C", "A wilting plant has most likely…", ["Gained water in its vacuoles", "Lost water from its vacuoles", "Grown more chloroplasts", "Lost its nucleus"], 1, "Less water → less turgor pressure → the plant droops.");
  M("C", "'Selectively permeable' means the membrane…", ["Lets everything through", "Lets nothing through", "Lets some substances through but not others", "Is made of cellulose"], 2, "It chooses what can pass in and out.");
  M("C", "Plant and animal cells are both…", ["Prokaryotic", "Eukaryotic", "Without a nucleus", "Without a membrane"], 1, "Eukaryotic cells have a nucleus and membrane-bound organelles.");
  M("C", "Which scientist first observed and named 'cells' while looking at cork?", ["Anton van Leeuwenhoek", "Robert Hooke", "Carl Linnaeus", "Theodor Schwann"], 1, "Robert Hooke saw tiny box-like spaces in cork and called them cells.");
  M("C", "Who first observed living microorganisms using improved microscopes?", ["Robert Hooke", "Matthias Schleiden", "Anton van Leeuwenhoek", "Carl Linnaeus"], 2, "Van Leeuwenhoek improved lenses and saw 'animalcules'.");
  M("C", "Which statement is part of cell theory?", ["Cells form from non-living matter", "All cells come from pre-existing cells", "Only animals are made of cells", "Cells are not alive"], 1, "Cell theory: all living things are made of cells, cells are the basic unit of life, cells come from pre-existing cells.");
  M("C", "Schleiden concluded that…", ["All animals are made of cells", "All plants are made of cells", "Cells come from cork", "DNA is in the nucleus"], 1, "Schleiden — plants; Schwann — animals.");
  M("C", "Which organelle would be MOST numerous in a muscle cell that uses lots of energy?", ["Chloroplasts", "Mitochondria", "Cell walls", "Vacuoles"], 1, "More respiration needed → more mitochondria.");
  M("C", "Which cell would you expect to contain chloroplasts?", ["Human cheek cell", "Leaf palisade cell", "Red blood cell", "Root hair cell"], 1, "Leaf cells receive light; root cells are underground and lack chloroplasts.");
  M("C", "The cell membrane in a plant cell is found…", ["Outside the cell wall", "Just inside the cell wall", "Inside the nucleus", "Inside the vacuole"], 1, "The membrane lies just inside the rigid cell wall.");

  // ---------- ORGANISATION & SPECIALISED CELLS (18) ----------
  M("O", "What is the correct order of organisation from simplest to most complex?", ["Tissue → cell → organ → organism → organ system", "Cell → tissue → organ → organ system → organism", "Cell → organ → tissue → organ system → organism", "Organism → organ system → organ → tissue → cell"], 1, "Specialised cell → tissue → organ → organ system → organism.");
  M("O", "A group of similar cells working together to perform a function is a…", ["Organ", "Tissue", "Organ system", "Organism"], 1, "Similar specialised cells = tissue.");
  M("O", "A structure made of two or more different tissues working together is a(n)…", ["Cell", "Tissue", "Organ", "Organelle"], 2, "e.g. the heart, a leaf or a root.");
  M("O", "The heart is an example of a(n)…", ["Tissue", "Organ", "Organ system", "Cell"], 1, "It contains muscle, nerve and connective tissue.");

  M("H", "On a heating curve, a flat plateau shows…", ["Temperature rising", "A change of state", "Particles getting bigger", "Cooling"], 1, "Temperature stays constant while the state changes.");

  M("H", "The FIRST plateau on a heating curve of ice shows…", ["Boiling", "Melting", "Condensation", "Freezing"], 1, "Plateau 1 = fusion (melting).");
  M("H", "The SECOND plateau on a heating curve of ice shows…", ["Melting", "Boiling", "Freezing", "Sublimation"], 1, "Plateau 2 = vaporisation (boiling).");

  M("W", "In the heating water investigation, the dependent variable is…", ["Time", "Temperature of the water", "Type of beaker", "Bunsen burner"], 1, "It is what you measure.");

  // ---------- SHORT ANSWER (50) ----------
  var sa = [];
  function S(t, q, m, ans, kw) { sa.push({ id: sa.length + 1, topic: t, q: q, marks: m, ans: ans, kw: kw }); }
  S("C", "Identify TWO structures found in both plant and animal cells.", 2, "Any two of: nucleus, cell membrane, cytoplasm, mitochondria.", [["nucleus"], ["membrane"], ["cytoplasm"], ["mitochondri"]]);
  S("C", "Describe the function of the nucleus.", 2, "The nucleus controls all the activities of the cell (1) and contains DNA, the genetic information (1).", [["control", "coordinat", "boss"], ["dna", "genetic"]]);
  S("C", "Describe the function of the cell membrane.", 2, "It controls what enters and leaves the cell (1) because it is selectively/partially permeable (1).", [["enter", "leave", "exit", "in and out"], ["selective", "partially permeable", "semi-permeable", "barrier"]]);
  S("C", "Explain the role of mitochondria in a cell.", 3, "Mitochondria are the site of cellular respiration (1), where glucose is broken down (1) to release usable energy as ATP for growth and repair (1).", [["respiration"], ["glucose"], ["energy", "atp"]]);
  S("C", "Explain why chloroplasts are needed in leaf cells.", 3, "Chloroplasts contain chlorophyll (1) which absorbs light energy (1) so photosynthesis can produce glucose (food) for the plant (1).", [["chlorophyll"], ["light"], ["photosynthesis", "glucose"]]);

  S("C", "Describe the function of the cytoplasm.", 2, "Jelly-like substance (1) where chemical reactions take place and organelles are suspended (1).", [["jelly", "fluid"], ["reaction", "suspend", "hold"]]);
  S("C", "Outline THREE differences between plant and animal cells.", 3, "Plant cells have a cell wall (1), chloroplasts (1), and a large central/permanent vacuole (1); animal cells do not (they only have small temporary vacuoles).", [["wall"], ["chloroplast"], ["vacuole"]]);
  S("C", "Explain how turgor pressure keeps a plant upright.", 3, "The large central vacuole fills with water (1) and pushes outward against the rigid cell wall (1), creating pressure that acts like a skeleton to keep the plant firm/upright (1).", [["vacuole"], ["water"], ["wall", "push", "pressure"]]);
  S("C", "Explain why a plant wilts when it is not watered.", 2, "Vacuoles lose water (1) so turgor pressure against the cell wall decreases and cells become floppy (1).", [["vacuole", "lose water", "loses water"], ["turgor", "pressure", "floppy", "limp"]]);
  S("C", "Explain how chloroplasts and mitochondria work together in a plant cell.", 3, "Chloroplasts make glucose by photosynthesis (1); mitochondria use this glucose in respiration (1) to release energy/ATP that the cell uses (1).", [["chloroplast"], ["glucose"], ["mitochondri", "atp", "energy"]]);
  S("C", "State the three parts of cell theory.", 3, "All living things are made of cells (1); cells are the basic unit of life (1); all cells come from pre-existing cells (1).", [["all living", "made of cells"], ["basic unit"], ["pre-existing", "existing cells", "come from"]]);
  S("C", "Describe the contribution of Robert Hooke to cell science.", 2, "He was the first to observe cells (1) by looking at cork under a microscope and named them 'cells' (1).", [["first", "observe"], ["cork"]]);
  S("C", "Explain why the cell wall is important to a plant that cannot move.", 2, "The rigid cell wall provides support and strength (1) and resists the push of the vacuole so cells don't burst, keeping the plant upright (1).", [["support", "strength", "rigid"], ["burst", "upright", "pressure"]]);

  S("O", "List the levels of organisation from simplest to most complex.", 2, "Cell → tissue → organ → organ system → organism.", [["cell"], ["tissue"], ["organ system"], ["organism"]]);
  S("O", "Define the term 'tissue' and give one example.", 2, "A group of similar specialised cells working together to perform a function (1), e.g. muscle tissue or xylem (1).", [["group", "similar"], ["muscle", "xylem", "nerve", "epithelial", "phloem", "vascular"]]);
  S("O", "Define the term 'organ' and give one example.", 2, "A structure made of two or more different tissues working together (1), e.g. heart, root, leaf, lungs (1).", [["tissues", "different"], ["heart", "root", "leaf", "lung", "stomach", "brain", "stem"]]);
  S("O", "Describe how the root hair cell is adapted to its function.", 2, "It has a long, thin projection giving a large surface area (1) to absorb more water and minerals by osmosis (1).", [["surface area"], ["water", "mineral", "osmosis"]]);
  S("O", "Describe TWO adaptations of a red blood cell.", 2, "Biconcave shape for large surface area (1); no nucleus to make room for more oxygen (1).", [["biconcave"], ["nucleus"]]);

  S("K", "Outline the rules for writing a binomial (scientific) name.", 3, "Two parts: genus then species (1); genus has a capital letter and species is lowercase (1); written in italics or underlined (1).", [["genus"], ["capital"], ["italic", "underline"]]);

  S("K", "Describe the rules for constructing a dichotomous key.", 3, "Only two options per step (1); no repeated questions (1); continue until only one organism remains (1). Use observable features.", [["two"], ["repeat"], ["one organism", "remain", "identified"]]);

  S("P", "Describe the arrangement and movement of particles in a solid.", 2, "Tightly packed in a fixed, regular lattice (1); vibrate in fixed positions (1).", [["packed", "lattice", "regular", "close"], ["vibrat"]]);

  S("P", "Explain why diffusion is faster in a gas than in a liquid.", 2, "Gas particles move faster (1) and have more space between them (1).", [["fast", "energy"], ["space"]]);
  S("P", "A student says 'particles get bigger when heated'. Correct this statement.", 2, "Particles never change size (1); heating increases their kinetic energy/speed and the spacing between them (1).", [["size", "same", "never"], ["energy", "faster", "spac", "apart"]]);
  S("P", "Explain why ice floats on water.", 2, "When water freezes its particles form a wide hexagonal lattice with gaps (1) so ice is less dense than liquid water (1).", [["hexagon", "lattice", "expand"], ["dens"]]);
  S("P", "Name the change of state for: (a) liquid → gas, (b) gas → liquid.", 2, "(a) evaporation/boiling (vaporisation) (1); (b) condensation (1).", [["evapor", "boil", "vapori"], ["condens"]]);
  S("P", "Describe how the three states of water are represented in the water cycle.", 3, "Liquid: oceans, rivers, rain (1); gas: water vapour after evaporation (1); solid: ice, snow, glaciers (1).", [["ocean", "river", "rain", "lake"], ["vapour", "evapor"], ["ice", "snow", "glacier"]]);

  S("H", "Explain why the temperature stays constant during melting.", 3, "Heat energy is still being added (1) but it is used to overcome/break the attractive forces between particles (1) instead of increasing their kinetic energy, so temperature doesn't rise (1).", [["energy"], ["force", "bond", "attract"], ["kinetic", "speed", "not increase"]]);

  S("W", "Identify the independent, dependent and one controlled variable in an investigation heating water over time.", 3, "Independent: time (1); dependent: temperature (1); controlled: e.g. volume of water, heat source, beaker type (1).", [["time"], ["temperature"], ["volume", "amount", "beaker", "burner", "heat source", "same"]]);
  S("W", "Describe TWO safety precautions when heating water with a Bunsen burner.", 2, "Wear safety goggles (1); tie hair back/use heatproof mat/don't touch hot equipment/stand while heating (1).", [["goggle", "glasses"], ["hair", "mat", "tongs", "stand", "touch", "apron"]]);

        "<h3>The scientists</h3><table><tr><th>Who</th><th>What they did</th></tr><tr><td>Robert Hooke</td><td>First to observe cells — looked at <b>cork</b> and named them “cells”.</td></tr><tr><td>Anton van Leeuwenhoek</td><td>Improved microscopes; first to see living microorganisms.</td></tr><tr><td>Schleiden</td><td>All <b>plants</b> are made of cells.</td></tr><tr><td>Schwann</td><td>All <b>animals</b> are made of cells.</td></tr></table>",

        "<h3>The “Big 5” organelles</h3><table><tr><th>Organelle</th><th>Nickname</th><th>Function</th></tr><tr><td>Nucleus</td><td>Control centre / boss</td><td>Holds DNA (genetic blueprint); coordinates all cell activities.</td></tr><tr><td>Cell membrane</td><td>Gatekeeper</td><td>Flexible barrier that controls what enters and exits — <i>selectively permeable</i>.</td></tr><tr><td>Cytoplasm</td><td>Factory floor</td><td>Jelly-like fluid where chemical reactions occur; suspends organelles.</td></tr><tr><td>Mitochondria</td><td>Powerhouse</td><td>Cellular respiration: glucose → usable energy (ATP) for growth & repair.</td></tr><tr><td>Chloroplasts</td><td>Solar panels (plants only)</td><td>Contain chlorophyll; photosynthesis makes glucose.</td></tr></table><p>Also: <b>cell wall</b> — support & strength; <b>vacuole</b> — stores water, maintains turgor pressure.</p>",
        "<h3>Photosynthesis</h3><p class='eq'>carbon dioxide + water <span>— light →</span> glucose + oxygen</p>",
        "<h3>The stationary survival team</h3><p>Plants can't move to find food or escape danger, so their organelles work as teams:</p><ul><li><b>Energy team:</b> chloroplast makes glucose → mitochondria unlock it as ATP.</li><li><b>Posture team (turgor pressure):</b> the vacuole fills with water like a water balloon and pushes against the rigid wall — acting like a skeleton that keeps the plant crisp and upright. Lose water → wilting.</li></ul>",
        "<h3>Leaves: stomata & guard cells</h3><ul><li><b>Stomata</b> — tiny openings for gas exchange: CO₂ in (for photosynthesis), O₂ out.</li><li><b>Guard cells</b> — full of water → stoma opens; lose water → stoma closes (prevents water loss).</li><li><b>Transpiration</b> — water leaves as vapour through the stomata.</li></ul>"
      ] },
    { id: "org", topic: "O", title: "2. Specialised cells & organisation", syl: "SC4-CLS-01 · Represent the arrangement of specialised cells in tissues and in organs",
      html: [
        "<h3>The hierarchy</h3><p class='eq'>specialised cell → tissue → organ → organ system → organism</p><table><tr><th>Level</th><th>Definition</th><th>Plant e.g.</th><th>Animal e.g.</th></tr><tr><td>Specialised cell</td><td>Unique features for one specific job</td><td>Root hair cell</td><td>Muscle cell</td></tr><tr><td>Tissue</td><td>Group of <i>similar</i> cells performing a function</td><td>Xylem (vascular)</td><td>Muscle tissue</td></tr><tr><td>Organ</td><td>Two or more <i>different</i> tissues cooperating</td><td>Root</td><td>Heart</td></tr><tr><td>Organ system</td><td>Different organs working together</td><td>Root system</td><td>Cardiovascular system</td></tr></table>",
        "<h3>Specialised cells</h3><table><tr><th>Cell</th><th>Adaptation</th><th>Function</th></tr><tr><td>Root hair</td><td>Long thin projection → large surface area</td><td>Absorbs water (osmosis) & minerals</td></tr><tr><td>Red blood cell</td><td>Biconcave, no nucleus</td><td>Carries oxygen</td></tr><tr><td>Nerve</td><td>Long</td><td>Carries electrical impulses</td></tr><tr><td>Sperm</td><td>Tail</td><td>Carries genetic info to the egg</td></tr><tr><td>Egg</td><td>Large yolk/food store</td><td>Supports new cell growth</td></tr><tr><td>Ciliated</td><td>Tiny hairs (cilia)</td><td>Stops dust & bacteria entering lungs</td></tr></table>",
        "<p class='tip'>Root hair: intake = long projection absorbs water by osmosis; the cell wall regulates quantity so the cell doesn't absorb too much and burst.</p>"

    { id: "class", topic: "K", title: "3. Living things & classification", syl: "SC4-CLS-01 · How structural features can be used to classify organisms",
      html: [
        "<h3>MRS GREN</h3><p><b>M</b>ovement · <b>R</b>espiration · <b>S</b>ensitivity · <b>G</b>rowth · <b>R</b>eproduction · <b>E</b>xcretion · <b>N</b>utrition</p>",
        "<h3>Why classify?</h3><p>To identify, compare and organise organisms and to show relationships.</p><h3>Binomial naming (Carl Linnaeus)</h3><p><i>Genus species</i> — e.g. <i>Homo sapiens</i>. Genus capital, species lowercase, italics (underline when handwritten).</p>",
        "<h3>Adaptations</h3><ul><li><b>Structural</b> — physical feature (polar bear fur, long beak).</li><li><b>Behavioural</b> — action (migration, nocturnal).</li><li><b>Physiological</b> — internal process (venom, toxins).</li></ul><h3>Dichotomous keys</h3><p>Questions with TWO choices each step; no repeated questions; continue until one organism remains.</p>"
      ] },
    { id: "part", topic: "P", title: "4. Particle theory & states of matter", syl: "SC4-SOL-01 · Identify 3 states & the water cycle; represent particle arrangement & movement; compare attractive forces",
      html: [
        "<p>Matter is made of particles. How a substance behaves depends on particle size, the spacing between them, their speed and how strongly they attract.</p>",
        "<table><tr><th></th><th>Solid (ice)</th><th>Liquid (water)</th><th>Gas (steam)</th></tr><tr><td>Arrangement</td><td>Fixed, regular lattice; tightly packed</td><td>Random, but still close</td><td>Widely spread, lots of empty space</td></tr><tr><td>Movement</td><td>Vibrate in fixed positions</td><td>Slide & roll past each other</td><td>Rapid & random in all directions</td></tr><tr><td>Attractive forces</td><td>Extremely strong</td><td>Weaker — allows flow</td><td>Very weak / negligible</td></tr><tr><td>Shape & volume</td><td>Fixed shape, fixed volume</td><td>No fixed shape, fixed volume</td><td>No fixed shape or volume</td></tr></table>",
        "<h3>Key ideas</h3><ul><li><b>Diffusion</b> — net movement of particles from high → low concentration due to random motion, until evenly mixed.</li><li><b>Particle size rule</b> — particles NEVER change size. Heating changes only their kinetic energy (speed) and spacing.</li><li><b>The water exception</b> — water expands when it freezes into a wide hexagonal lattice (so ice floats).</li></ul>",
        "<h3>Water on Earth</h3><p>Solid: ice caps, glaciers, snow · Liquid: oceans, rivers, rain · Gas: water vapour. Evaporation (sun heats oceans) → condensation (clouds) → precipitation → collection.</p>"
      ] },
    { id: "heat", topic: "H", title: "5. Heating curves & changes of state", syl: "SC4-SOL-01 · Measure & graph temperature of water as heated; identify changes of state",
      html: [
        "<p><b>Slanted lines</b> (temperature rising): thermal energy → kinetic energy; particles move faster, thermometer rises.</p><p><b>Flat plateaus</b> (temperature constant): heat is still added but kinetic energy does NOT increase. Energy is absorbed to <mark>overcome the attractive forces</mark> so the state can change.</p>",
        "<ul><li>Plateau 1 = <b>melting / fusion</b> (water: 0 °C)</li><li>Plateau 2 = <b>boiling / vaporisation</b> (water: 100 °C) — usually longer.</li></ul><p class='tip'>Exam tip: always read the exact number off the vertical axis to state the melting or boiling point, and refer to the stimulus data.</p>",
        "<h3>Names of changes</h3><p>melting (s→l) · freezing (l→s) · evaporation/boiling (l→g) · condensation (g→l) · sublimation (s→g)</p>"
      ] },
    { id: "ws", topic: "W", title: "6. Working scientifically", syl: "SC4-WS-04 · Follows a planned procedure to undertake safe and valid investigations",
      html: [
        "<h3>Variables</h3><ul><li><b>Independent</b> — what you change (time).</li><li><b>Dependent</b> — what you measure (temperature).</li><li><b>Controlled</b> — kept the same (volume of water, heat source, beaker).</li></ul><p><b>Valid</b> = fair test measuring what it should. <b>Reliable</b> = repeated results are consistent. <b>Accurate</b> = close to the true value.</p>",
        "<h3>Graphing</h3><p>Line graph for continuous data. Title, labelled axes with units, independent on x, dependent on y, even scale, line of best fit.</p>",
        "<h3>Microscope</h3><p>Eyepiece (look through) · Objective lens (magnifies) · Stage (holds slide) · Focus wheel · Lamp · Arm (carry) · Base (support).</p><h3>Wet mount</h3><p>Specimen on slide → drop of water/stain → lower coverslip at an angle (no bubbles) → observe.</p><h3>Scientific drawings</h3><p>Pencil · title · ruler · horizontal labels · no shading · no sketching.</p>",
        "<h3>SOLO writing (long responses)</h3><p>Identify → Describe → Explain (because… therefore…) → <b>Link</b> ideas together and use the stimulus.</p>"

  var long = [
    { id: 1, topic: "C", marks: 6, q: "Compare plant and animal cells, explaining how the structures unique to plant cells help a plant survive even though it cannot move.",
      plan: ["Identify shared structures", "Identify 3 plant-only structures", "Explain each function", "LINK: energy team & posture team → survival without moving"],
      model: "Plant and animal cells are both eukaryotic and share a nucleus (containing DNA, controlling the cell), a cell membrane (selectively permeable gatekeeper), cytoplasm (site of reactions) and mitochondria (respiration releasing ATP). However, plant cells also have a rigid cell wall, chloroplasts and a large central vacuole, while animal cells only have small temporary vacuoles. Because plants cannot move to find food, chloroplasts use light, carbon dioxide and water to make glucose by photosynthesis; the mitochondria then release this energy as ATP — together they form an 'energy team'. Plants also cannot move to hold themselves up, so the vacuole fills with water and pushes against the rigid cell wall, creating turgor pressure that acts like a skeleton keeping the plant upright. Therefore these unique structures allow a stationary plant to make its own food and stay upright to reach light." },
    { id: 2, topic: "O", marks: 5, q: "Using the root hair cell as an example, explain how specialised cells are organised into tissues, organs and organ systems.",
      plan: ["Define specialised cell + adaptation", "Tissue example", "Organ example", "Organ system", "LINK to whole plant survival"],
      model: "A specialised cell has features suited to one job: the root hair cell has a long thin projection giving a large surface area to absorb water by osmosis. Many similar root hair cells form root hair tissue, and water passes to xylem (vascular) tissue. Different tissues such as these cooperate to form an organ — the root. Many roots work together as the root system, an organ system that anchors the plant and supplies water and minerals. This water is needed for photosynthesis and turgor pressure, so organisation lets the organism survive." },
    { id: 3, topic: "P", marks: 6, q: "Explain the differences in the behaviour of solids, liquids and gases using particle theory, including the strength of attractive forces.",

    { id: 4, topic: "H", marks: 6, q: "A student heated ice from −20 °C until it boiled. The graph showed flat sections at 0 °C and 100 °C. Explain the shape of the heating curve using particle theory.",
      plan: ["Describe slopes (KE ↑)", "Plateau 1 at 0 °C = melting", "Plateau 2 at 100 °C = boiling", "Why temperature is constant", "Refer to stimulus values"],
      model: "On the sloped sections, heat energy is converted into kinetic energy so the particles vibrate or move faster and the temperature rises (from −20 °C to 0 °C as a solid, 0 °C to 100 °C as a liquid, then above 100 °C as a gas). At 0 °C the graph is flat: this is the melting point. Although heat is still added, the kinetic energy does not increase; instead the energy is used to overcome the strong attractive forces holding the ice lattice together so it becomes liquid. At 100 °C the second, longer plateau is the boiling point, where energy breaks the remaining attractive forces so particles escape as gas. The second plateau is longer because more energy is needed to separate particles completely." },
    { id: 5, topic: "W", marks: 5, q: "Design a safe and valid investigation to measure how the temperature of water changes as it is heated over time.",
      plan: ["Aim & variables (IV, DV, CV)", "Equipment & method steps", "Safety", "Reliability (repeat)", "Graph type"],

<script>

  // particles + heating curve
  function tempFromEnergy(E) {
    if (E <= 15) return { T: -20 + (E / 15) * 20, st: "solid", f: 0 };
    if (E <= 35) return { T: 0, st: "melting", f: (E - 15) / 20 };
    if (E <= 60) return { T: ((E - 35) / 25) * 100, st: "liquid", f: 0 };
    if (E <= 90) return { T: 100, st: "boiling", f: (E - 60) / 30 };
    return { T: 100 + ((E - 90) / 10) * 30, st: "gas", f: 0 };
  }
  function curvePts() { var p = []; for (var e = 0; e <= 100; e += 1) { var t = tempFromEnergy(e).T; p.push([40 + e * 2.6, 190 - ((t + 20) / 150) * 170]); } return p; }
  function particleView() {
    var dv = $("#dv");
    var pts = curvePts().map(function (p) { return p[0].toFixed(1) + "," + p[1].toFixed(1); }).join(" ");
    dv.innerHTML = '<div class="diagram-wrap"><div class="card"><canvas id="pc" width="560" height="340"></canvas>' +
      '<div style="margin-top:12px"><label class="muted" for="en">Heat added over time →</label><input type="range" id="en" min="0" max="100" value="5" /></div>' +
      '<div class="row" style="margin-top:8px"><button class="btn sm green" id="play">▶ Heat it up</button><button class="btn ghost sm" id="rst">Reset to ice</button></div></div>' +
      '<div class="card"><div class="row spread"><span id="pill" class="state-pill"></span><b id="tval" style="font:700 1.6rem var(--serif)"></b></div>' +
      '<svg viewBox="0 0 320 220" style="width:100%;margin:10px 0"><line x1="40" y1="10" x2="40" y2="190" stroke="#1c2529"/><line x1="40" y1="190" x2="310" y2="190" stroke="#1c2529"/>' +
      '<text x="6" y="16" font-size="10" fill="#7d878c">°C</text><text x="270" y="206" font-size="10" fill="#7d878c">time</text>' +
      '<text x="12" y="' + (190 - (20 / 150) * 170 + 3) + '" font-size="10">0</text><text x="6" y="' + (190 - (120 / 150) * 170 + 3) + '" font-size="10">100</text>' +
      '<line x1="40" x2="310" y1="' + (190 - (20 / 150) * 170) + '" y2="' + (190 - (20 / 150) * 170) + '" stroke="#dedad0" stroke-dasharray="3 3"/><line x1="40" x2="310" y1="' + (190 - (120 / 150) * 170) + '" y2="' + (190 - (120 / 150) * 170) + '" stroke="#dedad0" stroke-dasharray="3 3"/>' +
      '<polyline points="' + pts + '" fill="none" stroke="#2c6e49" stroke-width="3"/><circle id="dot" r="7" fill="#e8b53a" stroke="#1c2529" stroke-width="2"/></svg>' +
      '<p id="explain"></p></div></div>';
    var cv = $("#pc"), ctx = cv.getContext("2d"), W = cv.width, H = cv.height, n = 42, P = [];
    var cols = 7, rows = 6, gap = 26, ox = W / 2 - ((cols - 1) * gap) / 2, oy = H - 30 - (rows - 1) * gap;
    for (var i = 0; i < n; i++) { var hx = ox + (i % cols) * gap, hy = oy + Math.floor(i / cols) * gap; P.push({ hx: hx, hy: hy, x: hx, y: hy, vx: 0, vy: 0, m: "solid", o: Math.random() }); }
    var order = shuffle(P.map(function (_, i) { return i; }));
    var E = 5, playing = false, raf;
    function modeFor(idx, s) {
      var rank = order.indexOf(idx) / n;
      if (s.st === "solid") return "solid";
      if (s.st === "melting") return rank < s.f ? "liquid" : "solid";
      if (s.st === "liquid") return "liquid";
      if (s.st === "boiling") return rank < s.f ? "gas" : "liquid";
      return "gas";
    }
    var TEXT = {
      solid: "<b>Solid (ice).</b> Particles are locked in a fixed lattice by very strong attractive forces. Heat makes them <b>vibrate faster</b> in place, so the temperature rises.",
      melting: "<b>Plateau 1 — melting at 0 °C.</b> Heat is still going in, but the temperature stays flat: the energy is used to <b>overcome the attractive forces</b> holding the lattice, not to speed particles up.",
      liquid: "<b>Liquid (water).</b> Forces are weaker. Particles are still close but <b>slide past each other</b>. Extra heat becomes kinetic energy, so temperature rises.",
      boiling: "<b>Plateau 2 — boiling at 100 °C.</b> Energy breaks the remaining attractive forces so particles escape as gas. This plateau is longer — it takes more energy.",
      gas: "<b>Gas (steam).</b> Forces are negligible. Particles move <b>fast and randomly</b> with lots of empty space. Notice: the particles never get bigger!"
    };
    var lastSt = "";
    function setE(v) {
      E = v; $("#en").value = v;
      var s = tempFromEnergy(E);
      $("#tval").textContent = Math.round(s.T) + " °C";
      var pill = $("#pill"); pill.textContent = { solid: "Solid", melting: "Melting", liquid: "Liquid", boiling: "Boiling", gas: "Gas" }[s.st];
      pill.className = "state-pill state-" + (s.st === "melting" || s.st === "boiling" ? "change" : s.st);
      var c = curvePts()[Math.round(E)]; $("#dot").setAttribute("cx", c[0]); $("#dot").setAttribute("cy", c[1]);
      if (s.st !== lastSt) { $("#explain").innerHTML = TEXT[s.st]; lastSt = s.st; }
      P.forEach(function (p, i) {
        var m = modeFor(i, s);
        if (m !== p.m) { if (m === "solid") { p.x = p.hx; p.y = p.hy; } else { var sp = m === "gas" ? 4 : 1.2; var a = Math.random() * 6.28; p.vx = Math.cos(a) * sp; p.vy = Math.sin(a) * sp - (m === "gas" ? 2 : 0); } p.m = m; }
      });
    }
    function step() {
      var s = tempFromEnergy(E), heat = (s.T + 25) / 150;
      ctx.clearRect(0, 0, W, H);
      ctx.fillStyle = "#e9e5da"; ctx.fillRect(0, H - 8, W, 8);
      var liquidTop = H * 0.42;
      P.forEach(function (p) {
        var x, y;
        if (p.m === "solid") { var amp = 0.6 + heat * 4; x = p.hx + (Math.random() - 0.5) * amp; y = p.hy + (Math.random() - 0.5) * amp; }
        else {
          var maxV = p.m === "gas" ? 3 + heat * 3 : 0.8 + heat * 1.6;
          p.vx += (Math.random() - 0.5) * 0.5; p.vy += (Math.random() - 0.5) * 0.5 + (p.m === "liquid" ? 0.05 : 0);
          var v = Math.hypot(p.vx, p.vy); if (v > maxV) { p.vx *= maxV / v; p.vy *= maxV / v; }
          p.x += p.vx; p.y += p.vy;
          var top = p.m === "liquid" ? liquidTop : 12;
          if (p.x < 12) { p.x = 12; p.vx = Math.abs(p.vx); } if (p.x > W - 12) { p.x = W - 12; p.vx = -Math.abs(p.vx); }
          if (p.y < top) { p.y = top; p.vy = Math.abs(p.vy); } if (p.y > H - 20) { p.y = H - 20; p.vy = -Math.abs(p.vy); }
          x = p.x; y = p.y;

        ctx.fillStyle = p.m === "solid" ? "#2f5d86" : p.m === "liquid" ? "#2c6e49" : "#b8462f"; ctx.fill();
        ctx.lineWidth = 1.5; ctx.strokeStyle = "rgba(0,0,0,.25)"; ctx.stroke();
      });
      if (playing) { if (E < 100) setE(Math.min(100, E + 0.12)); else { playing = false; $("#play").textContent = "▶ Heat it up"; } }
      raf = requestAnimationFrame(step);
    }
    $("#en").oninput = function (e) { playing = false; $("#play").textContent = "▶ Heat it up"; setE(+e.target.value); };
    $("#play").onclick = function () { playing = !playing; if (playing && E >= 100) setE(0); this.textContent = playing ? "❚❚ Pause" : "▶ Heat it up"; };
    $("#rst").onclick = function () { playing = false; $("#play").textContent = "▶ Heat it up"; setE(0); };
    setE(5); step();
    cleanup = function () { cancelAnimationFrame(raf); };
  }

      '<div class="card"><h3 style="margin-top:0">Diffusion</h3><p>The net movement of particles from <b>high</b> concentration to <b>low</b> concentration, caused by their random motion.</p><p>It keeps going until the particles are <b>evenly mixed</b>. They are still moving after that — there is just no <i>net</i> movement.</p><p class="muted" id="count"></p></div></div>';
    var cv = $("#dc"), ctx = cv.getContext("2d"), W = cv.width, H = cv.height, P = [], open = false, raf;
    function reset() { open = false; P = []; for (var i = 0; i < 60; i++) P.push({ x: 15 + Math.random() * (W / 2 - 30), y: 15 + Math.random() * (H - 30), vx: Math.random() - 0.5, vy: Math.random() - 0.5 }); }
    function step() {
      var sp = $("#dst").value === "gas" ? 3 : 1;
      ctx.clearRect(0, 0, W, H);
      var right = 0;
      P.forEach(function (p) {
        p.vx += (Math.random() - 0.5) * 0.6; p.vy += (Math.random() - 0.5) * 0.6;
        var v = Math.hypot(p.vx, p.vy); if (v > sp) { p.vx *= sp / v; p.vy *= sp / v; }
        p.x += p.vx; p.y += p.vy;
        var maxX = open ? W - 8 : W / 2 - 8;
        if (p.x < 8) { p.x = 8; p.vx *= -1; } if (p.x > maxX) { p.x = maxX; p.vx = -Math.abs(p.vx); }
        if (p.y < 8) { p.y = 8; p.vy *= -1; } if (p.y > H - 8) { p.y = H - 8; p.vy *= -1; }
        if (p.x > W / 2) right++;
        ctx.beginPath(); ctx.arc(p.x, p.y, 6, 0, 6.283); ctx.fillStyle = "#b8462f"; ctx.fill();
      });
      if (!open) { ctx.fillStyle = "#1c2529"; ctx.fillRect(W / 2 - 2, 0, 4, H); }
      else { ctx.setLineDash([4, 6]); ctx.strokeStyle = "#7d878c"; ctx.beginPath(); ctx.moveTo(W / 2, 0); ctx.lineTo(W / 2, H); ctx.stroke(); ctx.setLineDash([]); }
      $("#count").textContent = "Left side: " + (60 - right) + " particles · Right side: " + right + " particles";
      raf = requestAnimationFrame(step);
    }

    $("#again").onclick = reset;
    reset(); step();
    cleanup = function () { cancelAnimationFrame(raf); };

          var weak = (text.split(/WEAKNESSES:/i)[1] || "").split(/TO GET FULL MARKS:/i)[0].split("\n").map(function (l) { return l.replace(/^[-•\s]+/, ""); }).filter(Boolean);

          : '<textarea id="ta" placeholder="Write your answer. Identify → describe → explain (because / therefore).">' + esc(M.as[q.id] || "") + "</textarea>";
        $("#mb").innerHTML = '<div class="card">' + head + '<p class="q">' + esc(q.q) + "</p>" + body + '</div><div class="row spread" style="margin-top:14px"><button class="btn ghost sm" id="pv"' + (n ? "" : " disabled") + '>← Back</button><button class="btn ghost sm" id="fg">' + (M.flag[n] ? "Unflag" : "⚑ Flag for review") + '</button><button class="btn sm" id="nx">' + (n === list.length - 1 ? "Review" : "Next →") + "</button></div>";
        if (it.k === "m") $(".opts").onclick = function (e) { var b = e.target.closest(".opt"); if (!b) return; M.am[q.id] = +b.dataset.i; save(); $$(".opt").forEach(function (x) { x.classList.toggle("picked", x === b); }); grid(); };
        else { var ta = $("#ta"); ta.oninput = function () { M.as[q.id] = ta.value; save(); grid(); }; ta.focus(); }
        $("#pv").onclick = function () { M.i--; save(); show(); };
        $("#nx").onclick = function () { if (M.i < list.length - 1) { M.i++; save(); show(); } else submitAsk(); };
        $("#fg").onclick = function () { M.flag[n] = !M.flag[n]; save(); show(); };
        grid();
      }
      $("#grid").onclick = function (e) { var b = e.target.closest("[data-n]"); if (b) { M.i = +b.dataset.n; save(); show(); } };
      $("#sub").onclick = submitAsk;
      function submitAsk() {
        var left = list.filter(function (it) { return it.k === "m" ? M.am[it.q.id] === undefined : !(M.as[it.q.id] || "").trim(); }).length;
        if (confirm(left ? left + " question(s) unanswered. Submit anyway?" : "Submit your mock for marking?")) finish();
      }
      function tick() {
        var ms = M.ends - Date.now();
        if (ms <= 0) { finish(); return; }
        var m = Math.floor(ms / 60000), s = Math.floor(ms / 1000) % 60, c = $("#clk");
        if (!c) return;
        c.textContent = m + ":" + (s < 10 ? "0" : "") + s;
        c.classList.toggle("warn", ms < 5 * 60000);
      }
      cleanupTimer = setInterval(tick, 1000); tick();
      cleanup = function () { clearInterval(cleanupTimer); cleanupTimer = null; };
      show();
    }
    function finish() {
      if (cleanupTimer) { clearInterval(cleanupTimer); cleanupTimer = null; }
      M.done = true; M.res = {}; M.d = Date.now(); save();
      results(true);
    }
    function results(fresh) {
      var mcScore = M.mc.filter(function (id) { return M.am[id] === Q.mcq[id - 1].a; }).length;
      var saMax = M.sa.reduce(function (t, id) { return t + Q.sa[id - 1].marks; }, 0), max = M.mc.length + saMax;
      function total() { return mcScore + M.sa.reduce(function (t, id) { return t + ((M.res[id] && M.res[id].sc) || 0); }, 0); }
      main.innerHTML = '<div class="mock-result"><p class="eyebrow">Mock result</p><div class="mock-score"><b id="tot">' + total() + '</b><span>/ ' + max + '</span></div><p class="lede" id="rmsg">' + (fresh ? "Marking your short answers…" : "") + '</p>' +
        '<div class="grid g2"><div class="card"><h2>Section I · ' + mcScore + " / " + M.mc.length + "</h2>" + M.mc.map(function (id, n) { var q = Q.mcq[id - 1], p = M.am[id], ok = p === q.a; return '<div class="mres ' + (ok ? "ok" : "no") + '"><b>Q' + (n + 1) + ".</b> " + esc(q.q) + '<div class="muted small">' + (ok ? "✓ " + esc(q.o[q.a]) : "Your answer: " + (p === undefined ? "—" : esc(q.o[p])) + " · Correct: " + esc(q.o[q.a])) + "</div></div>"; }).join("") + "</div>" +
        '<div class="card"><h2>Section II</h2><div id="sares">' + M.sa.map(function (id, n) { var q = Q.sa[id - 1]; return '<details class="mres" id="r' + id + '"><summary><b>Q' + (n + 9) + ".</b> " + esc(q.q) + ' <span class="done" id="s' + id + '">' + (M.res[id] ? M.res[id].sc + "/" + q.marks : "…") + '</span></summary><p class="small"><b>Your answer:</b> ' + esc(M.as[id] || "—") + '</p><div class="feedback small" id="f' + id + '">' + esc((M.res[id] && M.res[id].fb) || "Waiting to be marked…") + "</div></details>"; }).join("") + "</div></div></div>" +
        '<div class="row" style="margin-top:18px"><button class="btn" id="again">New mock</button><button class="btn ghost" data-go="home">Dashboard</button></div></div>';
      $("#again").onclick = function () { start(); };
      var todo = M.sa.filter(function (id) { return !M.res[id]; });
      function next() {
        if (!todo.length) {
          $("#rmsg") && ($("#rmsg").textContent = "All marked. Open each short answer to see your feedback.");
          if (fresh && !M.logged) { M.logged = true; S.mockHist.unshift({ d: M.d, score: total(), max: max }); S.mockHist = S.mockHist.slice(0, 20); M.mc.forEach(function (id) { var q = Q.mcq[id - 1]; record(q.topic, M.am[id] === q.a ? 1 : 0, 1); }); save(); }
          return;
        }
        var id = todo.shift(), q = Q.sa[id - 1], ans = (M.as[id] || "").trim();
        function done(sc, fb, weak) { M.res[id] = { sc: sc, fb: fb }; record(q.topic, sc, q.marks); if (weak && weak.length && sc < q.marks) addWeak(q.topic, weak.slice(0, 2), "mock"); save(); var e = $("#s" + id); if (e) { e.textContent = sc + "/" + q.marks; $("#f" + id).textContent = fb; $("#tot").textContent = total(); } next(); }
        if (ans.length < 3) return done(0, "No answer given.\n\nModel answer: " + q.ans, ["Left Q blank: " + q.q.slice(0, 70)]);
        aiStream({ mode: "mark", question: q.q, marks: q.marks, guide: q.ans, answer: ans }, function (t) { var e = $("#f" + id); if (e) e.textContent = t; })
          .then(function (text) {
            var m = text.match(/SCORE:\s*(\d+)/i), sc = m ? Math.min(+m[1], q.marks) : 0;
            var weak = (text.split(/WEAKNESSES:/i)[1] || "").split(/TO GET FULL MARKS:/i)[0].split("\n").map(function (l) { return l.replace(/^[-•\s]+/, ""); }).filter(Boolean);
            done(sc, text.replace(/SCORE:.*\n?/i, ""), weak);
          })
          .catch(function () { var r = offlineMark(q, ans); done(r.score, "Quick check (AI marker offline).\n" + (r.miss.length ? "Missing: " + r.miss.join(", ") : "All key ideas included.") + "\n\nModel answer: " + q.ans, r.miss); });
      }
      next();
    }
  };
  var cleanupTimer = null;

  // ---------- GRADES ----------
  R.grades = function () {
    var g = "A";
    function draw() {
      main.innerHTML = '<p class="eyebrow">Grade descriptors</p><h1>What each grade looks like</h1><p class="lede">The verb is the giveaway: E/D <b>identify</b>, C/B <b>describe</b>, A <b>explains</b> — with links, examples, terminology and data.</p>' +
        '<div class="grid g2" style="margin-top:18px"><div class="card"><div class="grade-tabs">' + "ABCDE".split("").map(function (x) { return '<button data-g="' + x + '" aria-pressed="' + (x === g) + '">' + x + "</button>"; }).join("") + '</div><ul class="clean">' + N.grades[g].map(function (l) { return "<li>" + esc(l) + "</li>"; }).join("") + "</ul></div>" +
        '<div class="card"><h2>Turning a C into an A</h2><ol class="plan"><li><b>Identify</b> the structure or idea (name it).</li><li><b>Describe</b> what it is or does.</li><li><b>Explain</b> why/how using <i>because</i> and <i>therefore</i>.</li><li><b>Link</b> it to the bigger idea, a second concept or the stimulus.</li><li>Quote numbers from the graph or table with units.</li></ol><p class="tip">C: “The vacuole stores water.”<br>A: “The large central vacuole fills with water and pushes against the rigid cell wall, <b>therefore</b> creating turgor pressure that keeps the plant upright <b>because</b> plants have no skeleton.”</p></div></div>' +
        '<div class="card" style="margin-top:16px"><h2>Syllabus outcomes on this test</h2>' + N.notes.map(function (n) { return "<p>" + tag(n.topic) + " " + esc(n.syl) + "</p>"; }).join("") + '<p class="muted">Separation techniques are part of SC4-SOL-01 but are not being tested.</p></div>';
      $(".grade-tabs").onclick = function (e) { var b = e.target.closest("[data-g]"); if (b) { g = b.dataset.g; draw(); } };
    }
    draw();
  };

  route();
})();

</script>
</body>
</html>
